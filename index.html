<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#920c1b"><title>كادو | المنيو</title><style>:root{--wine:#920c1b;--gold:#f5a30b;--cream:#fff8ee;--ink:#2d1813;--muted:#806b64}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}.hero{min-height:245px;text-align:center;color:#fff;padding:28px 16px;background:radial-gradient(circle at 50% 0,#c01c32,var(--wine) 48%,#570710)}.mark{width:93px;height:93px;margin:auto;border-radius:50%;background:#9e101f;border:4px solid var(--gold);display:grid;place-items:center;box-shadow:0 10px 25px #28000888;color:#fff;font-weight:bold;line-height:1.05;font-size:22px}.mark b{color:var(--gold);font-size:16px}.hero h1{font-size:30px;margin:12px 0 7px}.hero p{margin:0;color:#ffe5aa}.wrap{max-width:950px;margin:auto;padding:21px 16px 50px}.tabs{display:flex;gap:10px;overflow:auto;padding:3px 1px 20px}.tabs button{flex:0 0 auto;border:0;border-radius:15px;background:#fff;color:var(--wine);padding:9px 14px;box-shadow:0 3px 12px #4b0f1015;font-weight:bold;cursor:pointer}.section-title{font-size:22px;color:var(--wine);border-top:1px solid #ead7cc;padding-top:18px;margin:21px 0 13px}.section-title span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);margin-left:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;overflow:hidden;border-radius:17px;box-shadow:0 5px 20px #4b10110f}.food{height:150px;width:100%;object-fit:cover;background:#f6ce82}.card-body{padding:13px}.card h3{margin:0 0 8px;font-size:17px}.card p{margin:0 0 10px;min-height:18px;color:var(--muted);font-size:13px;line-height:1.6}.price{font-weight:bold;color:var(--wine)}.empty{text-align:center;padding:37px;color:var(--muted)}.footer{text-align:center;padding:22px;color:var(--muted);font-size:13px}.hidden{display:none!important}.admin{min-height:100vh;background:#f7eee7}.admin-head{padding:16px;color:white;background:var(--wine);display:flex;justify-content:space-between;align-items:center}.admin-main{max-width:1000px;margin:auto;padding:23px 15px}.panel{background:#fff;border-radius:17px;padding:20px;margin-bottom:17px;box-shadow:0 5px 20px #4d15110f}.panel h2{margin-top:0;color:var(--wine);font-size:20px}.login{max-width:390px;margin:10vh auto}.field{display:grid;gap:6px;font-weight:bold;font-size:14px;margin:10px 0}.field input,.field textarea,.field select{border:1px solid #e4d4cc;border-radius:10px;padding:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--wine);color:#fff;font-weight:bold;cursor:pointer}.gold{background:var(--gold);color:#532500}.danger{background:#c22e38}.gray{background:#eee;color:#493530}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.row{border:1px solid #eeded5;border-radius:13px;padding:13px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.full{grid-column:1/-1}.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px}.status{font-weight:bold;margin-top:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.food{height:112px}.card-body{padding:10px}.card h3{font-size:15px}}</style></head><body><div id="public"><header class="hero"><div class="mark">كادو<br><b>KADO</b></div><h1>كادو</h1><p id="tagline">طعم يستاهل التجربة</p></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="sections"></div><p class="empty" id="empty">جاري تحميل المنيو…</p></main><footer class="footer">كادو — منيو الطعام</footer></div><div id="admin" class="admin hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://zgeupjmdfmisndyypuui.supabase.co',KEY='sb_publishable_EEmChBPZdNO8LwwszgS2fQ_VKYNBOHo',db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),safe=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let menu={restaurant:{name:'كادو',tagline:'طعم يستاهل التجربة'},categories:[],items:[]};const icon='🍽️';async function load(){const{data,error}=await db.from('menu_data').select('data').eq('id',1).maybeSingle();if(error){$('#empty').textContent='تعذر تحميل المنيو حالياً.';return}if(data?.data)menu=data.data;render()}function render(){$('#tagline').textContent=menu.restaurant.tagline||'طعم يستاهل التجربة';if(!menu.categories.length){$('#empty').textContent='المنيو راح ينضاف قريباً ✨';return}$('#empty').classList.add('hidden');$('#tabs').innerHTML=menu.categories.map(c=>`<button onclick="go('${c.id}')">${icon} ${safe(c.name)}</button>`).join('');$('#sections').innerHTML=menu.categories.map(c=>{const items=menu.items.filter(i=>i.categoryId===c.id&&i.available);return`<section id="c-${c.id}"><h2 class="section-title"><span>${icon}</span>${safe(c.name)}</h2>${items.length?`<div class="cards">${items.map(i=>`<article class="card">${i.image?`<img class="food" src="${i.image}" alt="${safe(i.name)}">`:'<div class="food" style="display:grid;place-items:center;font-size:42px">🍽️</div>'}<div class="card-body"><h3>${safe(i.name)}</h3><p>${safe(i.description)}</p><div class="price">${Number(i.price||0).toLocaleString('en-US')} د.ع</div></div></article>`).join('')}</div>`:'<p class="empty">لا توجد أصناف ظاهرة حالياً.</p>'}</section>`}).join('')}window.go=id=>document.getElementById('c-'+id).scrollIntoView({behavior:'smooth'});function adminLogin(){return`<main class="panel login"><div class="mark">كادو<br><b>KADO</b></div><h1 style="text-align:center;color:var(--wine)">إدارة كادو</h1><p>سجّل دخول بحساب الإدارة.</p><label class="field">البريد الإلكتروني<input id="email" type="email" value="kadoo4261@gmail.com"></label><label class="field">كلمة المرور<input id="pass" type="password"></label><div class="actions"><button class="btn" onclick="signIn()">دخول</button><button class="btn gold" onclick="signUp()">إنشاء حساب الإدارة أول مرة</button></div><p class="status" id="msg"></p></main>`}async function signIn(){const{error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)return message(error.message,false);admin()}async function signUp(){const{error}=await db.auth.signUp({email:$('#email').value,password:$('#pass').value});message(error?error.message:'تم إرسال رسالة تأكيد إلى بريدك. افتحها ثم سجّل الدخول.',!error)}function message(t,ok=true){const e=$('#msg');e.textContent=t;e.style.color=ok?'#187344':'#b51e28'}function catRow(c={id:crypto.randomUUID(),name:''}){return`<div class="row cat" data-id="${c.id}"><label class="field">اسم القسم<input class="catname" value="${safe(c.name)}" placeholder="مثال: البرگر"></label><button class="btn danger" onclick="this.closest('.cat').remove()">حذف القسم</button></div>`}function itemRow(i={id:crypto.randomUUID(),name:'',price:'',description:'',categoryId:menu.categories[0]?.id||'',available:true,image:''}){return`<div class="row item" data-id="${i.id}" data-image="${i.image||''}"><div class="grid"><label class="field">اسم الأكلة<input class="iname" value="${safe(i.name)}"></label><label class="field">السعر<input class="iprice" type="number" value="${i.price||''}"></label><label class="field">القسم<select class="icat">${menu.categories.map(c=>`<option value="${c.id}" ${i.categoryId===c.id?'selected':''}>${safe(c.name)}</option>`).join('')}</select></label><label class="field">الصورة<input class="ifile" type="file" accept="image/*" onchange="preview(this)"></label><label class="field full">الوصف<textarea class="idesc">${safe(i.description)}</textarea></label><label class="field">تظهر للزبائن<select class="iavail"><option value="yes" ${i.available!==false?'selected':''}>نعم</option><option value="no" ${i.available===false?'selected':''}>موقوفة</option></select></label><div class="preview">${i.image?`<img class="thumb" src="${i.image}">`:''}</div></div><button class="btn danger" onclick="this.closest('.item').remove()">حذف الأكلة</button></div>`}async function admin(){const{data:{user}}=await db.auth.getUser();if(!user){$('#admin').innerHTML=adminLogin();return}await load();$('#admin').innerHTML=`<header class="admin-head"><strong>لوحة إدارة كادو</strong><button class="btn gold" onclick="logout()">خروج</button></header><main class="admin-main"><section class="panel"><h2>تعريف المنيو</h2><label class="field">العبارة تحت الاسم<input id="adminTag" value="${safe(menu.restaurant.tagline)}"></label></section><section class="panel"><h2>الأقسام</h2><div id="cats">${menu.categories.map(catRow).join('')}</div><div class="actions"><button class="btn gold" onclick="addCat()">+ إضافة قسم</button></div></section><section class="panel"><h2>الأكلات</h2><div id="items">${menu.items.map(itemRow).join('')}</div><div class="actions"><button class="btn gold" onclick="addItem()">+ إضافة أكلة</button></div></section><section class="panel"><button class="btn" onclick="saveMenu()">حفظ ونشر التعديلات</button><p class="status" id="saveMsg"></p></section></main>`}window.addCat=()=>$('#cats').insertAdjacentHTML('beforeend',catRow());window.addItem=()=>{if(!menu.categories.length)return alert('أضف قسماً أولاً');$('#items').insertAdjacentHTML('beforeend',itemRow())};window.preview=input=>{const file=input.files[0],row=input.closest('.item');if(!file)return;const r=new FileReader();r.onload=()=>{row.dataset.image=r.result;row.querySelector('.preview').innerHTML=`<img class="thumb" src="${r.result}">`};r.readAsDataURL(file)};async function image(url,id){if(!url.startsWith('data:image/'))return url;const blob=await fetch(url).then(r=>r.blob()),path='foods/'+id+'-'+Date.now()+'.'+(blob.type.split('/')[1]||'jpg');const{error}=await db.storage.from('menu-images').upload(path,blob,{contentType:blob.type});if(error)throw error;return db.storage.from('menu-images').getPublicUrl(path).data.publicUrl}window.saveMenu=async()=>{try{const categories=[...document.querySelectorAll('.cat')].map((e,i)=>({id:e.dataset.id,name:e.querySelector('.catname').value.trim(),order:i})).filter(c=>c.name),ids=new Set(categories.map(c=>c.id)),items=[];for(const[e,i]of[...document.querySelectorAll('.item')].entries()){const categoryId=e.querySelector('.icat').value;if(!ids.has(categoryId))continue;items.push({id:e.dataset.id,name:e.querySelector('.iname').value.trim(),price:Number(e.querySelector('.iprice').value)||0,description:e.querySelector('.idesc').value.trim(),categoryId,available:e.querySelector('.iavail').value==='yes',order:i,image:await image(e.dataset.image,e.dataset.id)})}const data={restaurant:{name:'كادو',tagline:$('#adminTag').value},categories,items:items.filter(i=>i.name)};const{error}=await db.from('menu_data').upsert({id:1,data});if(error)throw error;menu=data;$('#saveMsg').textContent='تم الحفظ والنشر بنجاح ✓';$('#saveMsg').style.color='#187344'}catch(e){$('#saveMsg').textContent=e.message;$('#saveMsg').style.color='#b51e28'}};window.logout=async()=>{await db.auth.signOut();location.href=location.pathname};if(location.search.includes('admin=1')){$('#public').classList.add('hidden');$('#admin').classList.remove('hidden');admin()}else load();</script></body></html>
